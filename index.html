<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Til Julie · Fra mig til dig</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- Header -->
        <header class="header">
            <p class="eyebrow">FRA MIG TIL DIG</p><h1 class="signature">Din Tobias</h1>
        </header>

        <!-- Player -->
        <div class="player">
            <div class="album-art">
                <div class="waveform">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="song-info">
                <h2 id="currentSong">Vælg en sang</h2>
                <p id="currentTime">00:00</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <input 
                    type="range" 
                    aria-label="Placering i sangen" id="progressBar" 
                    class="progress-bar" 
                    value="0" 
                    min="0" 
                    max="100"
                >
                <span id="duration">00:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button aria-label="Forrige sang" id="prevBtn" class="control-btn">⏮️</button>
                <button aria-label="Afspil" id="playPauseBtn" class="control-btn play-btn">▶️</button>
                <button aria-label="Næste sang" id="nextBtn" class="control-btn">⏭️</button>
            </div>

            <!-- Volume -->
            <div class="volume-control">
                <label for="volumeSlider">🔊</label>
                <input 
                    type="range" 
                    aria-label="Lydstyrke" id="volumeSlider" 
                    class="volume-slider" 
                    value="100" 
                    min="0" 
                    max="100"
                >
            </div>
        </div>

        <!-- Playlist -->
        <section class="playlist-section">
            <h3>Sange til dig</h3><p class="playlist-intro">Tryk på en sang, og lad mig være lidt tættere på.</p>
            <div id="playlist" class="playlist">
                <!-- Sange bliver tilføjet af JavaScript -->
            </div>
        </section>
        <p id="playerStatus" role="status" class="player-status"></p><footer>Lavet med kærlighed, kun til dig ♡</footer></main><!-- Hidden audio element -->
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
