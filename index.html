<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julies Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>❤️ Julies personlige playliste ❤️</h1>
        </header>

        <!-- Player -->
        <div class="player">
            <div class="album-art">
                <div class="waveform">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="song-info">
                <h2 id="currentSong">Vælg en sang</h2>
                <p id="currentTime">00:00</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <input 
                    type="range" 
                    id="progressBar" 
                    class="progress-bar" 
                    value="0" 
                    min="0" 
                    max="100"
                >
                <span id="duration">00:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prevBtn" class="control-btn">⏮️</button>
                <button id="playPauseBtn" class="control-btn play-btn">▶️</button>
                <button id="nextBtn" class="control-btn">⏭️</button>
            </div>

            <!-- Volume -->
            <div class="volume-control">
                <label for="volumeSlider">🔊</label>
                <input 
                    type="range" 
                    id="volumeSlider" 
                    class="volume-slider" 
                    value="100" 
                    min="0" 
                    max="100"
                >
            </div>
        </div>

        <!-- Playlist -->
        <section class="playlist-section">
            <h3>Sange</h3>
            <div id="playlist" class="playlist">
                <!-- Sange bliver tilføjet af JavaScript -->
            </div>
        </section>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
